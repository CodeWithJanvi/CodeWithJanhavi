<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Services - what Janvi creates" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f8"/>
      <stop offset="1" stop-color="#f0ebff"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .l{opacity:0;animation:fade .6s ease forwards}
    @keyframes fade{from{opacity:0}to{opacity:1}}
  </style>

  <rect x="1" y="1" width="998" height="298" rx="24" fill="url(#bg)" stroke="#e9d5ff" stroke-width="2"/>

  <g filter="url(#sh)">
    <rect x="24" y="24" width="952" height="252" rx="14" fill="#ffffff" stroke="#f0e1fa"/>
  </g>
  <rect x="24" y="24" width="952" height="38" rx="14" fill="#fbf5ff"/>
  <rect x="24" y="48" width="952" height="14" fill="#fbf5ff"/>
  <circle cx="46" cy="43" r="5.5" fill="#ff5f57"/>
  <circle cx="64" cy="43" r="5.5" fill="#febc2e"/>
  <circle cx="82" cy="43" r="5.5" fill="#28c840"/>
  <text x="500" y="47" text-anchor="middle" class="mono" font-size="11" fill="#9ca3af">~/services.sh</text>

  <!-- Card 1 -->
  <g class="l" style="animation-delay:.1s">
    <rect x="48" y="84" width="212" height="170" rx="12" fill="#faf5ff" stroke="#e9d5ff"/>
    <circle cx="76" cy="112" r="14" fill="url(#g)"/>
    <text x="76" y="116" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ffffff">01</text>
    <text x="64" y="152" class="sans" font-size="16" font-weight="700" fill="#4c1d95">Websites</text>
    <g class="sans" font-size="12.5" fill="#6b7280">
      <text x="64" y="178">Modern, responsive</text>
      <text x="64" y="198">websites built with</text>
      <text x="64" y="218">PHP, HTML, CSS &amp; JS</text>
    </g>
  </g>

  <!-- Card 2 -->
  <g class="l" style="animation-delay:.3s">
    <rect x="276" y="84" width="212" height="170" rx="12" fill="#fdf2f8" stroke="#fbcfe8"/>
    <circle cx="304" cy="112" r="14" fill="url(#g)"/>
    <text x="304" y="116" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ffffff">02</text>
    <text x="292" y="152" class="sans" font-size="16" font-weight="700" fill="#831843">PHP / Laravel Apps</text>
    <g class="sans" font-size="12.5" fill="#6b7280">
      <text x="292" y="178">Dashboards, business</text>
      <text x="292" y="198">systems and management</text>
      <text x="292" y="218">applications with MySQL</text>
    </g>
  </g>

  <!-- Card 3 -->
  <g class="l" style="animation-delay:.5s">
    <rect x="504" y="84" width="212" height="170" rx="12" fill="#faf5ff" stroke="#e9d5ff"/>
    <circle cx="532" cy="112" r="14" fill="url(#g)"/>
    <text x="532" y="116" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ffffff">03</text>
    <text x="520" y="152" class="sans" font-size="16" font-weight="700" fill="#4c1d95">Website Templates</text>
    <g class="sans" font-size="12.5" fill="#6b7280">
      <text x="520" y="178">Creative landing pages</text>
      <text x="520" y="198">and UI templates,</text>
      <text x="520" y="218">ready to customise</text>
    </g>
  </g>

  <!-- Card 4 -->
  <g class="l" style="animation-delay:.7s">
    <rect x="732" y="84" width="212" height="170" rx="12" fill="#fdf2f8" stroke="#fbcfe8"/>
    <circle cx="760" cy="112" r="14" fill="url(#g)"/>
    <text x="760" y="116" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ffffff">04</text>
    <text x="748" y="152" class="sans" font-size="16" font-weight="700" fill="#831843">Video Editing</text>
    <g class="sans" font-size="12.5" fill="#6b7280">
      <text x="748" y="178">Promo videos, reels</text>
      <text x="748" y="198">and social media</text>
      <text x="748" y="218">content &amp; creatives</text>
    </g>
  </g>
</svg>
