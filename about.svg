<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="About Janvi Lumbhani" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1f8"/>
      <stop offset="1" stop-color="#f0ebff"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8b5cf6" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .l{opacity:0;animation:fade .6s ease forwards}
    @keyframes fade{from{opacity:0}to{opacity:1}}
  </style>

  <rect x="1" y="1" width="998" height="298" rx="24" fill="url(#bg)" stroke="#e9d5ff" stroke-width="2"/>

  <g filter="url(#sh)">
    <rect x="24" y="24" width="952" height="252" rx="14" fill="#ffffff" stroke="#f0e1fa"/>
  </g>
  <rect x="24" y="24" width="952" height="38" rx="14" fill="#fbf5ff"/>
  <rect x="24" y="48" width="952" height="14" fill="#fbf5ff"/>
  <circle cx="46" cy="43" r="5.5" fill="#ff5f57"/>
  <circle cx="64" cy="43" r="5.5" fill="#febc2e"/>
  <circle cx="82" cy="43" r="5.5" fill="#28c840"/>
  <text x="500" y="47" text-anchor="middle" class="mono" font-size="11" fill="#9ca3af">~/about.md</text>

  <text class="sans" x="48" y="92" font-size="24" font-weight="700" fill="url(#g)"># About Me</text>

  <g class="sans" font-size="15" fill="#374151">
    <text class="l" x="48" y="126" style="animation-delay:.2s">Hi, I’m Janvi, a PHP &amp; Laravel web developer at Webcare Infoway.</text>
    <text class="l" x="48" y="150" style="animation-delay:.5s">I build clean, responsive websites, dashboards and business applications,</text>
    <text class="l" x="48" y="174" style="animation-delay:.8s">and I design modern website templates. Outside of code, I edit promotional</text>
    <text class="l" x="48" y="198" style="animation-delay:1.1s">videos and social media content, so my work always mixes logic with creativity.</text>
  </g>

  <g class="sans" font-size="12" font-weight="600" text-anchor="middle">
    <rect x="48" y="222" width="160" height="30" rx="15" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="128" y="241" fill="#6d28d9">Open to freelance work</text>
    <rect x="218" y="222" width="130" height="30" rx="15" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="283" y="241" fill="#be185d">Always learning</text>
    <rect x="358" y="222" width="140" height="30" rx="15" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="428" y="241" fill="#6d28d9">Code + Creativity</text>
  </g>
</svg>
